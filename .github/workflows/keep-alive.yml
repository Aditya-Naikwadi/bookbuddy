name: Render Backend Keep-Alive Ping

on:
  schedule:
    # Run every 12 minutes to keep Render free-tier backend warm (Render spins down after 15 mins of inactivity)
    - cron: '*/12 * * * *'
  workflow_dispatch: # Allows manual triggering from GitHub Actions tab

jobs:
  keep-alive:
    name: Ping Render Backend Service
    runs-on: ubuntu-latest
    steps:
      - name: Ping Keep-Alive Endpoint
        run: |
          TARGET_URL="${{ secrets.RENDER_PING_URL }}"
          if [ -z "$TARGET_URL" ]; then
            TARGET_URL="https://bookbuddy-kcwl.onrender.com/ping"
          fi
          echo "Pinging backend keep-alive endpoint at: $TARGET_URL"
          curl -sf -A "GitHubActions-KeepAlive/1.0" --max-time 15 "$TARGET_URL" || exit 1
