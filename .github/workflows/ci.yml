name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Install Dependencies
        run: |
          cd server
          npm ci

      - name: Run Linter
        run: |
          cd server
          npm run lint

      - name: Run Tests
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017/bookbuddy_test
          JWT_SECRET: testjwtsecretkey999
          JWT_REFRESH_SECRET: testjwtrefreshsecretkey999
          JWT_ACCESS_EXPIRY: 15m
          JWT_REFRESH_EXPIRY: 7d
          CLIENT_ORIGIN: http://localhost:5173
          PORT: 5000
        run: |
          cd server
          npm test

      - name: Build Check
        run: |
          cd server
          npm run build
