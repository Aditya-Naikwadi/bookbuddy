name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Server Dependencies
        run: |
          cd server
          npm install --legacy-peer-deps

      - name: Run Linter
        run: |
          cd server
          npm run lint

      - name: Validate Required Environment Variables
        run: |
          node -e "
            const required = ['MONGO_URI', 'JWT_SECRET', 'JWT_REFRESH_SECRET', 'CLIENT_ORIGIN'];
            const missing = required.filter(k => !process.env[k]);
            if (missing.length > 0) {
              console.error('Missing required CI env vars:', missing);
              process.exit(1);
            }
            console.log('CI Environment variables validation passed.');
          "
        env:
          MONGO_URI: mongodb://localhost:27017/bookbuddy_test
          JWT_SECRET: testjwtsecretkey999
          JWT_REFRESH_SECRET: testjwtrefreshsecretkey999
          CLIENT_ORIGIN: http://localhost:5173

      - name: Run Tests
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017/bookbuddy_test
          JWT_SECRET: testjwtsecretkey999
          JWT_REFRESH_SECRET: testjwtrefreshsecretkey999
          JWT_ACCESS_EXPIRY: 15m
          JWT_REFRESH_EXPIRY: 7d
          CLIENT_ORIGIN: http://localhost:5173
          PORT: 5000
        run: |
          cd server
          npm test

      - name: Install Client & Build Check
        run: |
          cd client
          npm install --legacy-peer-deps
          npm run build

  deploy-vercel:
    name: Deploy to Vercel Production
    needs: ci
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Project Artifacts
        run: vercel build --prod
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel Production
        run: vercel deploy --prebuilt --prod
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  deploy-docker:
    name: Build & Push Production Docker Image
    needs: ci
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Lowercase Repository Name
        run: |
          echo "REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/bookbuddy-server:latest
            ghcr.io/${{ env.REPO_LOWER }}/bookbuddy-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
