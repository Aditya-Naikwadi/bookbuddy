name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Install Dependencies
        run: |
          cd server
          npm ci

      - name: Run Linter
        run: |
          cd server
          npm run lint

      - name: Run Tests
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017/bookbuddy_test
          JWT_SECRET: testjwtsecretkey999
          JWT_REFRESH_SECRET: testjwtrefreshsecretkey999
          JWT_ACCESS_EXPIRY: 15m
          JWT_REFRESH_EXPIRY: 7d
          CLIENT_ORIGIN: http://localhost:5173
          PORT: 5000
        run: |
          cd server
          npm test

      - name: Build Check
        run: |
          cd server
          npm run build

  deploy:
    name: Build & Push Production Docker Image
    needs: ci
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/bookbuddy-server:latest
            ghcr.io/${{ github.repository }}/bookbuddy-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
