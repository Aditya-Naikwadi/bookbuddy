name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  ci:
    name: Continuous Integration (Lint, Test, Build)
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Server Dependencies
        run: |
          cd server
          npm install --legacy-peer-deps

      - name: Run Server Linter
        run: |
          cd server
          npm run lint

      - name: Validate Required Environment Variables
        run: |
          node -e "
            const required = ['MONGO_URI', 'JWT_SECRET', 'JWT_REFRESH_SECRET', 'CLIENT_ORIGIN'];
            const missing = required.filter(k => !process.env[k]);
            if (missing.length > 0) {
              console.error('Missing required CI env vars:', missing);
              process.exit(1);
            }
            console.log('CI Environment variables validation passed.');
          "
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/bookbuddy_test
          JWT_SECRET: testjwtsecretkey999
          JWT_REFRESH_SECRET: testjwtrefreshsecretkey999
          CLIENT_ORIGIN: http://localhost:5173

      - name: Run Server Tests
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://127.0.0.1:27017/bookbuddy_test
          JWT_SECRET: testjwtsecretkey999
          JWT_REFRESH_SECRET: testjwtrefreshsecretkey999
          JWT_ACCESS_EXPIRY: 15m
          JWT_REFRESH_EXPIRY: 7d
          CLIENT_ORIGIN: http://localhost:5173
          PORT: 5000
        run: |
          cd server
          npm test

      - name: Install Client Dependencies
        run: |
          cd client
          npm install --legacy-peer-deps --include=dev

      - name: Run Client Linter & Tests
        run: |
          cd client
          npm run lint
          npm test

      - name: Build Client Production Bundle
        run: |
          cd client
          npm run build

  deploy-vercel:
    name: Deploy to Vercel Production
    needs: ci
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check Vercel Credentials
        id: check_vercel
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "::warning::VERCEL_TOKEN secret is not set in GitHub Repository Secrets. Skipping Vercel automated CLI deployment."
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
          fi

      - name: Install Vercel CLI
        if: steps.check_vercel.outputs.has_token == 'true'
        run: npm install -g vercel@latest

      - name: Pull Vercel Environment Information
        if: steps.check_vercel.outputs.has_token == 'true'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        if: steps.check_vercel.outputs.has_token == 'true'
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel Production
        if: steps.check_vercel.outputs.has_token == 'true'
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  deploy-docker:
    name: Build & Push Production Docker Image
    needs: ci
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/bookbuddy-server
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-render:
    name: Trigger Render Production Deployment
    needs: [ci, deploy-docker]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Trigger Render Service Deployment
        env:
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID || 'srv-d9rltltbedkc73c1khkg' }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          if [ -z "$RENDER_API_KEY" ]; then
            echo "::warning::RENDER_API_KEY secret is not set in GitHub Environment Secrets. Skipping Render API deployment trigger."
          else
            echo "🚀 Triggering Render deployment for service ${RENDER_SERVICE_ID}..."
            curl --request POST \
              --url "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
              --header "Authorization: Bearer ${RENDER_API_KEY}" \
              --header "Accept: application/json" \
              --header "Content-Type: application/json"
          fi

  verify-post-deploy:
    name: Verify Post-Push Live Production Deployment
    needs: [deploy-vercel, deploy-docker, deploy-render]
    if: always() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && !cancelled()
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Print & Verify Target Production URL
        env:
          RESOLVED_APP_URL: ${{ vars.PRODUCTION_APP_URL || 'https://bookbuddy-kcwl.onrender.com' }}
        run: |
          echo "====================================================="
          echo "🌐 RESOLVED PRODUCTION_APP_URL: ${RESOLVED_APP_URL}"
          echo "====================================================="

      - name: Run Post-Deploy Live Verification
        env:
          APP_URL: ${{ vars.PRODUCTION_APP_URL || 'https://bookbuddy-kcwl.onrender.com' }}
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
          TIMEOUT_SECONDS: 600
          POLL_INTERVAL_SECONDS: 15
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID || 'srv-d9rltltbedkc73c1khkg' }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node scripts/verify-deployment.js

      - name: Upload Audit History Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-audit-log-${{ github.sha }}
          path: logs/deployment-audit.jsonl
          retention-days: 90
          if-no-files-found: ignore

      - name: Alert on Verification Automation Failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          node -e "
          const https = require('https');
          const webhook = process.env.SLACK_WEBHOOK_URL;
          if (!webhook) {
            console.log('No Slack webhook configured.');
            process.exit(0);
          }
          const payload = JSON.stringify({
            text: '🚨 *POST-DEPLOY VERIFICATION FAILED / CRASHED:* Post-push deployment verification did not pass!',
            attachments: [{
              color: '#a30200',
              fields: [
                { title: 'Commit SHA', value: '${{ github.sha }}', short: true },
                { title: 'Workflow', value: '${{ github.workflow }}', short: true },
                { title: 'Run Number', value: '${{ github.run_number }}', short: true },
                { title: 'Action Required', value: 'Check deployment logs & consider rollback', short: true }
              ],
              ts: Math.floor(Date.now() / 1000)
            }]
          });
          const urlObj = new URL(webhook);
          const req = https.request({
            hostname: urlObj.hostname,
            port: 443,
            path: urlObj.pathname + urlObj.search,
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Content-Length': Buffer.byteLength(payload) }
          });
          req.write(payload);
          req.end();
          "
