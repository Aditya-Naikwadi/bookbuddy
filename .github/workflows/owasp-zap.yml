name: OWASP ZAP Live Security Scan

on:
  schedule:
    # Run weekly baseline security scan on Sundays at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  zap_scan:
    name: OWASP ZAP Baseline Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: OWASP ZAP Baseline Scan (Backend)
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'https://bookbuddy-kcwl.onrender.com'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
          allow_issue_writing: false
