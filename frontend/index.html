    <link rel="manifest" href="/manifest.json" />
    <link rel="canonical" href="https://bookbuddy.app/" />

    <!-- Schema.org JSON-LD Structured Data: WebSite & Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://bookbuddy.app/#website",
            "url": "https://bookbuddy.app/",
            "name": "BookBuddy",
            "description": "Smart Library System & Digital Reading Platform for Universities and Students",
            "potentialAction": {
              "@type": "SearchAction",
              "target": "https://bookbuddy.app/#catalog-search?q={search_term_string}",
              "query-input": "required name=search_term_string"
            }
          },
          {
            "@type": "Organization",
            "@id": "https://bookbuddy.app/#organization",
            "name": "BookBuddy",
            "url": "https://bookbuddy.app/",
            "logo": "https://bookbuddy.app/favicon.png",
            "sameAs": [
              "https://twitter.com/bookbuddyapp",
              "https://github.com/Aditya-Naikwadi/bookbuddy"
            ]
          }
        ]
      }
    </script>

    <!-- Performance & Font Optimization: Preconnect + font-display: swap + Devanagari regional scripts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Serif+Devanagari:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var theme =
            saved === "light" || saved === "dark"
              ? saved
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.classList.remove("light", "dark");
          document.documentElement.classList.add(theme);
        } catch (e) {}
      })();
    </script>
  </head>

            <li><a href="/auth/register">Sign Up for Free</a></li>
          </ul>
        </nav>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
