# ==============================================================================
# BookBuddy Production Nginx Configuration
# Wildcard Subdomain Routing & SSL Termination (*.bookbuddy.com & bookbuddy.com)
# ==============================================================================

# Worker connections and events
events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format with tenant subdomain capture
    log_format tenant_combined '$remote_addr - $remote_user [$time_local] '
                               '"$request" $status $body_bytes_sent '
                               '"$http_referer" "$http_user_agent" '
                               'host="$host" subdomain="$subdomain" rt=$request_time';

    access_log /var/log/nginx/access.log tenant_combined;
    error_log /var/log/nginx/error.log warn;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript 
               application/rss+xml application/atom+xml image/svg+xml;

    # Request limits (Allow 25MB CSV uploads for 10k-row bulk student ingestion)
    client_max_body_size 25M;
    client_body_buffer_size 1M;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=2r/s;

    # Upstream backend pool across scaled Node.js instances
    upstream bookbuddy_backend {
        # Sticky sessions for Socket.io long-polling fallback
        ip_hash;
        server 127.0.0.1:5001 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:5002 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # Upstream frontend (Vite SSR / preview or static root)
    upstream bookbuddy_frontend {
        server 127.0.0.1:5173;
        keepalive 32;
    }

    # --------------------------------------------------------------------------
    # 1. HTTP -> HTTPS Redirection (Port 80)
    # --------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name ~^(?<subdomain>[a-z0-9-]+)\.bookbuddy\.com$ bookbuddy.com www.bookbuddy.com;

        # Let's Encrypt ACME challenge location for non-DNS renewals
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --------------------------------------------------------------------------
    # 2. HTTPS Main & Wildcard Subdomain Server Block (Port 443)
    # --------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;

        # Captures individual college tenant slugs into $subdomain
        server_name ~^(?<subdomain>[a-z0-9-]+)\.bookbuddy\.com$ bookbuddy.com;

        # SSL Certificates (Let's Encrypt Wildcard)
        ssl_certificate /etc/letsencrypt/live/bookbuddy.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/bookbuddy.com/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/bookbuddy.com/chain.pem;

        # Modern TLS Security Best Practices
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:20m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # OCSP Stapling
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout 5s;

        # HTTP Strict Transport Security (HSTS) with Subdomains
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ----------------------------------------------------------------------
        # Backend API Endpoints (/api/v1/)
        # ----------------------------------------------------------------------
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass http://bookbuddy_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Forward client and tenant metadata
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Tenant-Subdomain $subdomain;

            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # Auth rate limit override
        location /api/v1/auth/login {
            limit_req zone=auth_limit burst=10 nodelay;

            proxy_pass http://bookbuddy_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Tenant-Subdomain $subdomain;
        }

        # Bulk roster upload rate limit & timeout override
        location /api/v1/admin/students/upload {
            limit_req zone=upload_limit burst=5 nodelay;

            proxy_pass http://bookbuddy_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Tenant-Subdomain $subdomain;

            # Extended timeouts for large multipart ingestion
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # ----------------------------------------------------------------------
        # Socket.io Real-time WebSocket Gateway
        # ----------------------------------------------------------------------
        location /socket.io/ {
            proxy_pass http://bookbuddy_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Tenant-Subdomain $subdomain;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ----------------------------------------------------------------------
        # Single Page Application (Frontend Client)
        # ----------------------------------------------------------------------
        location / {
            proxy_pass http://bookbuddy_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Tenant-Subdomain $subdomain;

            # Static asset caching
            location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp)$ {
                proxy_pass http://bookbuddy_frontend;
                expires 30d;
                add_header Cache-Control "public, no-transform";
            }
        }
    }
}
