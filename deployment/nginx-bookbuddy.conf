# ==============================================================================
# BookBuddy Production Nginx Configuration (GCP Compute Engine VM)
# Dynamic Subdomain Tenant Routing & Reverse Proxy (*.<domain> & <domain>)
# ==============================================================================

# Top-level upstream pool pointing to local PM2 cluster instances
upstream bookbuddy_backend_upstream {
    # Sticky session hashing for Socket.io transport fallback
    ip_hash;
    server 127.0.0.1:5000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=bookbuddy_api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=bookbuddy_auth_limit:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=bookbuddy_upload_limit:10m rate=2r/s;

# ------------------------------------------------------------------------------
# 1. HTTP Server Block (Port 80) -> Redirect to HTTPS
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Let's Encrypt ACME challenge endpoint for automatic renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS Main & Wildcard Subdomain Server Block (Port 443)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    # Capture tenant subdomain into $subdomain variable
    # Replace bookbuddy.app with your registered apex domain
    server_name ~^(?<subdomain>[a-z0-9-]+)\.bookbuddy\.app$ bookbuddy.app www.bookbuddy.app;

    # SSL Certificates (Cloudflare Origin CA or Let's Encrypt Wildcard)
    ssl_certificate /etc/letsencrypt/live/bookbuddy.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bookbuddy.app/privkey.pem;

    # TLS Protocols & Cipher Suites
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/rss+xml application/atom+xml image/svg+xml;

    # Request Size Limits (support CSV rosters and cover image uploads)
    client_max_body_size 25M;
    client_body_buffer_size 1M;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # --------------------------------------------------------------------------
    # Frontend Single Page Application (Static Client)
    # --------------------------------------------------------------------------
    root /var/www/bookbuddy/frontend/dist;
    index index.html;

    # Hashed static assets -> Immutable caching (1 year)
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|webp|ico|gif)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Version manifest and service worker -> Never cache
    location ~* (?:version\.json|sw\.js|manifest\.json)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # SPA routing fallback (deep links resolve to index.html)
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # --------------------------------------------------------------------------
    # Backend API Endpoints (/api/v1/)
    # --------------------------------------------------------------------------
    location /api/ {
        limit_req zone=bookbuddy_api_limit burst=50 nodelay;

        proxy_pass http://bookbuddy_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Forward headers for tenant and IP isolation
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tenant-Subdomain $subdomain;

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Dedicated Rate Limits for Authentication Endpoints
    location /api/v1/auth/login {
        limit_req zone=bookbuddy_auth_limit burst=10 nodelay;

        proxy_pass http://bookbuddy_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tenant-Subdomain $subdomain;
    }

    # Extended timeout for bulk student CSV roster ingestion
    location /api/v1/admin/students/upload {
        limit_req zone=bookbuddy_upload_limit burst=5 nodelay;

        proxy_pass http://bookbuddy_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tenant-Subdomain $subdomain;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # --------------------------------------------------------------------------
    # Real-time WebSocket Gateway (Socket.io)
    # --------------------------------------------------------------------------
    location /socket.io/ {
        proxy_pass http://bookbuddy_backend_upstream;
        proxy_http_version 1.1;

        # WebSocket Upgrade Handshake
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tenant-Subdomain $subdomain;

        # Long-lived WebSocket connection timeouts
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --------------------------------------------------------------------------
    # Health Probe
    # --------------------------------------------------------------------------
    location /health {
        proxy_pass http://bookbuddy_backend_upstream;
        proxy_set_header Host $host;
    }
}
