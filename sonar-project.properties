# SonarQube Community Edition Project Configuration
sonar.projectKey=BookBuddy
sonar.projectName=BookBuddy Campus Library & Digital Hub
sonar.projectVersion=1.0.0

# Source Directories
sonar.sources=backend/src,frontend/src
sonar.tests=backend/src/tests

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/uploads/**,**/logs/**
sonar.test.inclusions=backend/src/tests/**/*.js,frontend/src/**/*.test.jsx

# Encoding and Language Settings
sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
