# SonarQube Community Edition Project Configuration
sonar.projectKey=BookBuddy
sonar.projectName=BookBuddy Campus Library & Digital Hub
sonar.projectVersion=1.0.0

# Source Directories
sonar.sources=server/src,client/src
sonar.tests=server/src/tests

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/uploads/**,**/logs/**
sonar.test.inclusions=server/src/tests/**/*.js,client/src/**/*.test.jsx

# Encoding and Language Settings
sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=server/coverage/lcov.info
