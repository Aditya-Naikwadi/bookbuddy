# Sample Nginx Load Balancer Configuration for BookBuddy Multi-Instance Deployment
events {
    worker_connections 1024;
}

http {
    # Upstream backend pool across horizontally scaled Node instances
    upstream bookbuddy_backend {
        # Enable IP-hash sticky sessions for Socket.io long-polling transport fallback
        ip_hash;
        server 127.0.0.1:5001 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:5002 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name localhost;

        # Client asset & static bundle proxy
        location / {
            proxy_pass http://bookbuddy_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket & Real-time Socket.io Endpoint
        location /socket.io/ {
            proxy_pass http://bookbuddy_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Health Check Route
        location /api/health {
            proxy_pass http://bookbuddy_backend;
            proxy_set_header Host $host;
        }
    }
}
