version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bookbuddy-backend
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGO_URI=mongodb://db:27017/bookbuddy
      - JWT_SECRET=supersecret123
      - JWT_REFRESH_SECRET=supersecretrefresh123
      - SESSION_SECRET=supersecretsession123
      - CLIENT_ORIGIN=http://localhost:5173
      - JWT_ACCESS_EXPIRY=15m
      - JWT_REFRESH_EXPIRY=7d
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-placeholder_google_client_id}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-placeholder_google_client_secret}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL:-http://localhost:5000/api/v1/auth/google/callback}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-placeholder_github_client_id}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-placeholder_github_client_secret}
      - GITHUB_CALLBACK_URL=${GITHUB_CALLBACK_URL:-http://localhost:5000/api/v1/auth/github/callback}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  db:
    image: mongo:7-jammy
    container_name: bookbuddy-mongodb
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  mongo_data:
